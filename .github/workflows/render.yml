name: Render

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # TinyTeX installs any LaTeX package a render asks for.
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - run: uv sync

      # The review as HTML and PDF, into _site/.
      - name: Render
        run: uv run quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Publish _site/ to GitHub Pages on pushes to the default branch. Needs
  # Pages switched on with "GitHub Actions" as the source (see the README).
  deploy:
    needs: render
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
